<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор Интерактивных Книг "Живая Книга"</title>
  
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Comfortaa:wght@400;600;700&family=Marck+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0a0814; --bg-card: rgba(23, 18, 41, 0.85); --bg-parchment: #fcf8e8;
      --primary-gold: #ffd700; --accent-gold: #f39c12; --magic-purple: #8a2be2; --magic-cyan: #00f3ff;
      --glow-purple: 0 0 15px rgba(138, 43, 226, 0.8); --glow-gold: 0 0 15px rgba(255, 215, 0, 0.8); --glow-cyan: 0 0 15px rgba(0, 243, 255, 0.8);
      --border-magic: 1px solid rgba(255, 215, 0, 0.3);
      --font-title: 'Cinzel', serif; --font-body: 'Comic Sans MS', 'Comfortaa', cursive; --font-hand: 'Comic Sans MS', 'Marck Script', cursive;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: var(--bg-dark); background-image: radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.1) 0%, transparent 40%), radial-gradient(circle at 50% 50%, rgba(15, 10, 30, 0.9) 0%, #05030a 100%); color: #e0e0ff; font-family: var(--font-body); font-size: 14pt; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    header { height: 70px; background: rgba(12, 9, 26, 0.9); border-bottom: 2px solid rgba(255, 215, 0, 0.4); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5), var(--glow-purple); z-index: 100; }
    .app-title { font-family: var(--font-title); font-size: 1.5rem; color: var(--primary-gold); text-shadow: 0 0 12px rgba(255, 215, 0, 0.7); display: flex; align-items: center; gap: 10px; }
    .header-lang-select { background: rgba(10, 7, 22, 0.8); border: var(--border-magic); color: var(--primary-gold); padding: 6px 12px; border-radius: 12px; font-family: var(--font-body); font-size: 14pt; cursor: pointer; }

    .workspace { display: flex; flex: 1; height: calc(100vh - 70px); overflow: hidden; }
    .editor-panel { width: 40%; min-width: 450px; background: var(--bg-card); backdrop-filter: blur(10px); border-right: 2px solid rgba(255, 215, 0, 0.3); display: flex; flex-direction: column; box-shadow: 5px 0 25px rgba(0,0,0,0.5); z-index: 10; overflow-y: auto;}
    
    .editor-tabs { display: flex; background: rgba(8, 5, 18, 0.8); border-bottom: 1px solid rgba(255, 215, 0, 0.2); overflow-x: auto; flex-shrink: 0;}
    .editor-tabs::-webkit-scrollbar { height: 4px; } .editor-tabs::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 2px; }
    .tab-btn { padding: 14px 16px; background: transparent; border: none; color: #9a94b8; font-family: var(--font-body); font-size: 12pt; font-weight: bold; cursor: pointer; white-space: nowrap; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; border-bottom: 3px solid transparent; }
    .tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
    .tab-btn.active { color: var(--primary-gold); border-bottom-color: var(--primary-gold); background: rgba(138, 43, 226, 0.25); text-shadow: var(--glow-gold); }

    .tab-content-container { flex: 1; overflow-y: auto; padding: 20px; }
    .tab-content-container::-webkit-scrollbar { width: 8px; } .tab-content-container::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.4); border-radius: 4px; }
    .tab-panel { display: none; animation: fadeIn 0.4s ease forwards; } .tab-panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .form-group { margin-bottom: 20px; } .form-group label { display: block; font-size: 12pt; color: var(--primary-gold); margin-bottom: 8px; font-weight: bold; }
    .form-control, select, textarea { width: 100%; padding: 12px; background: rgba(10, 7, 22, 0.7); border: 2px solid rgba(255, 215, 0, 0.3); border-radius: 12px; color: #fff; font-family: var(--font-body); font-size: 14pt; transition: all 0.3s ease; }
    .form-control:focus, select:focus, textarea:focus { outline: none; border-color: var(--magic-cyan); box-shadow: var(--glow-cyan); }
    textarea { resize: vertical; min-height: 100px; }
    
    .btn { padding: 12px 18px; border: none; border-radius: 20px; font-family: var(--font-body); font-weight: bold; font-size: 14pt; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    .btn-magic { background: linear-gradient(135deg, var(--magic-purple), #4b0082); color: #fff; border: 2px solid var(--primary-gold); box-shadow: var(--glow-purple), inset 0 0 10px rgba(255,255,255,0.2); }
    .btn-magic:hover { background: linear-gradient(135deg, #a033ff, #6a00ba); box-shadow: 0 0 25px rgba(160, 51, 255, 0.9); transform: translateY(-2px) scale(1.02); }
    .btn-gold { background: linear-gradient(135deg, #f39c12, #d35400); color: #fff; border: 2px solid var(--primary-gold); box-shadow: var(--glow-gold), inset 0 0 10px rgba(255,255,255,0.2); }
    .btn-gold:hover { background: linear-gradient(135deg, #f1c40f, #e67e22); box-shadow: 0 0 25px rgba(255, 215, 0, 0.9); transform: translateY(-2px) scale(1.02); }
    .btn-danger { background: rgba(217, 83, 79, 0.2); color: #ff6b6b; border: 2px solid #d9534f; border-radius: 20px; }
    .btn-danger:hover { background: #d9534f; color: #fff; box-shadow: 0 0 15px rgba(217, 83, 79, 0.7); }
    .btn-block { width: 100%; }

    .page-list-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 15px; }
    .page-chip { padding: 8px 16px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,215,0,0.3); border-radius: 20px; cursor: pointer; font-size: 12pt; white-space: nowrap; transition: all 0.3s; }
    .page-chip.active { background: var(--primary-gold); color: #000; font-weight: bold; box-shadow: var(--glow-gold); }

    .template-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,215,0,0.2); margin-bottom: 10px; }
    .template-item span { font-weight: bold; color: var(--primary-gold); } 
    .template-actions { display: flex; gap: 8px; }
    .btn-action { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,215,0,0.4); border-radius: 12px; padding: 8px 12px; cursor:pointer; transition: 0.3s; }
    .btn-action:hover { background: rgba(255,215,0,0.3); }

    .preview-panel { width: 60%; flex: 1; display: flex; flex-direction: column; background: rgba(5, 3, 10, 0.95); position: relative; overflow: hidden;}
    
    .mode-bar { height: 60px; background: rgba(15, 10, 30, 0.9); border-bottom: 2px solid rgba(255, 215, 0, 0.3); display: flex; align-items: center; justify-content: center; gap: 20px; padding: 0 20px; z-index: 100; }
    .mode-btn { padding: 10px 22px; border-radius: 25px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255, 215, 0, 0.3); color: #aaa; font-family: var(--font-body); font-size: 12pt; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
    .mode-btn.active { background: linear-gradient(90deg, #8a2be2, #00f3ff); color: #fff; border-color: #fff; box-shadow: var(--glow-cyan); font-weight: bold; }

    /* Шкала прогресса */
    .progress-map-container { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 40%; height: 12px; background: rgba(0,0,0,0.6); border-radius: 20px; border: 2px solid var(--primary-gold); z-index: 50; box-shadow: var(--glow-gold); overflow: hidden; display: none; }
    .progress-map-fill { height: 100%; background: linear-gradient(90deg, var(--magic-purple), var(--magic-cyan), var(--primary-gold)); width: 0%; transition: width 0.5s ease-in-out; }

    .canvas-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden; position: relative; }

    /* Редактор Разворота (Spread View) */
    .book-stage-edit { display: none; width: 900px; height: 600px; margin: 0 auto; box-shadow: 0 0 45px rgba(0,0,0,0.9); border-radius: 12px; border: 6px solid #2a1a08; overflow: hidden; position: relative; }
    .book-stage-edit.active { display: flex; }
    .edit-half { width: 50%; height: 100%; position: relative; background-color: var(--bg-parchment); background-size: cover; background-position: center; border-right: 1px solid rgba(0,0,0,0.2); overflow: hidden;}
    .shirt-half { width: 100%; height: 100%; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }

    /* Контейнер для PageFlip */
    .book-stage-flip { display:none; width:100%; height:100%; align-items:center; justify-content:center; }
    .book-stage-flip.active { display: flex; }
    
    .stf__wrapper { border: 6px solid #3d2608; border-radius: 8px; box-shadow: 0 0 45px rgba(0,0,0,0.9); }
    .stf__block { box-shadow: inset 0 0 20px rgba(139, 69, 19, 0.4); }
    
    .page { background-color: var(--bg-parchment); background-size: cover; background-position: center; position: relative; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.2);}
    .page-wrapper { width: 100%; height: 100%; position: relative; cursor: zoom-in; background-size: cover; background-position: center; overflow: hidden; }
    .page-wrapper.edit-mode { cursor: default; }

    /* Элементы холста и Drag & Drop & Resize */
    .canvas-element { position: absolute; padding: 10px; box-sizing: border-box;}
    .edit-mode .canvas-element { cursor: grab; pointer-events: auto !important; }
    .edit-mode .canvas-element.dragging { cursor: grabbing; opacity: 0.8; z-index: 1000 !important; }
    
    .resizer { width: 16px; height: 16px; background: var(--primary-gold); border: 2px solid #000; border-radius: 50%; position: absolute; right: -8px; bottom: -8px; cursor: se-resize; z-index: 1000; display: none; }
    .edit-mode .canvas-element:hover .resizer { display: block; }
    
    .page-text-render { white-space: pre-wrap; word-break: break-word; pointer-events: none; }
    .page-img-render { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); pointer-events: none; }

    /* Глоссарий & Пасхалки */
    .glossary-word { pointer-events: auto; text-decoration: underline dashed var(--primary-gold); text-underline-offset: 4px; cursor: help; position: relative; font-weight: bold; }
    .glossary-word:hover::after { content: attr(data-hint); position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%); background: var(--bg-card); color: var(--primary-gold); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--primary-gold); white-space: nowrap; z-index: 100; font-family: var(--font-body); font-size: 12pt; box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: none; }
    
    .easter-egg-element { pointer-events: auto; position: absolute; z-index: 45; background-size:contain; background-repeat:no-repeat; background-position:center;}
    .read-mode .easter-egg-element { cursor: pointer; transition: transform 0.2s; }
    .read-mode .easter-egg-element:hover { transform: scale(1.1); filter: drop-shadow(0 0 10px var(--primary-gold)); }
    .edit-mode .easter-egg-element { cursor: grab; }
    
    .egg-found-anim { pointer-events: none; animation: popScore 1s forwards; color: var(--primary-gold); font-weight: bold; text-shadow: 0 0 10px #000; position: absolute; z-index: 9999; font-size: 24pt; }
    @keyframes popScore { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }

    .trigger-task-btn { pointer-events: auto; background: linear-gradient(135deg, #ff007f, #7928ca); color: white; padding: 14px 28px; border-radius: 30px; border: 3px solid var(--primary-gold); font-family: var(--font-body); font-weight: bold; font-size: 14pt; cursor: pointer; box-shadow: var(--glow-purple); animation: pulse 2s infinite; display: flex; align-items: center; gap: 12px; z-index: 50; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); }
    @keyframes pulse { 0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 15px rgba(255,0,127,0.6); } 50% { transform: translateX(-50%) scale(1.08); box-shadow: 0 0 35px rgba(255,0,127,1); } 100% { transform: translateX(-50%) scale(1); box-shadow: 0 0 15px rgba(255,0,127,0.6); } }

    .tts-btn { pointer-events: auto; position:absolute; top:15px; right:15px; width:45px; height:45px; border-radius:50%; background:rgba(30,20,50,0.9); border:2px solid var(--primary-gold); color:var(--primary-gold); font-size:14pt; cursor:pointer; z-index:60; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.5); transition:0.3s;}
    .tts-btn:hover { background: var(--primary-gold); color: #000; transform: scale(1.1); }

    /* ZOOM Overlay (Лупа) */
    .zoom-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 9000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .zoom-overlay.active { opacity: 1; pointer-events: auto; }
    .zoomed-page-clone { width: 450px; height: 600px; transform: scale(1.25); background-color: var(--bg-parchment); background-size: cover; background-position: center; border-radius: 12px; box-shadow: 0 0 50px rgba(0,0,0,1); position: relative; overflow: hidden; cursor: zoom-out; border: 4px solid #3d2608; }

    /* Модалки (Задания и Фидбек) */
    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8, 5, 20, 0.85); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .task-card { width: 90%; max-width: 600px; background: linear-gradient(135deg, #1c1335, #0d081e); border: 3px solid var(--primary-gold); border-radius: 24px; padding: 30px; box-shadow: var(--glow-purple); color: #fff; transform: translateY(30px); transition: transform 0.3s ease; max-height: 90vh; overflow-y: auto; }
    .modal-overlay.active .task-card { transform: translateY(0); }
    .task-question { font-family: var(--font-title); color: var(--primary-gold); font-size: 16pt; margin-bottom: 25px; }
    .task-option { background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 215, 0, 0.4); padding: 14px 20px; border-radius: 15px; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: all 0.2s; }
    .task-option:hover { background: rgba(138, 43, 226, 0.4); border-color: var(--magic-cyan); }
    .task-option input { accent-color: var(--primary-gold); transform: scale(1.4); }
    .match-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; } .match-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; } .match-row span { flex: 1; font-size: 14pt; } .match-row select { flex: 1; }

    .feedback-view { width: 100%; height: 100%; background: linear-gradient(135deg, #100a26, #05020f); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; color: #fff; z-index: 100; position:absolute; }
    .badge-icon { font-size: 4rem; color: var(--primary-gold); text-shadow: var(--glow-gold); margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
    .qr-container { background: white; padding: 10px; border-radius: 12px; margin: 15px 0; border: 3px solid var(--primary-gold); box-shadow: var(--glow-gold); }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .audio-recorder { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; }
    .record-btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: #e74c3c; color: white; font-size: 20pt; cursor: pointer; box-shadow: 0 0 15px rgba(231, 76, 60, 0.6); transition: all 0.3s; }
    .record-btn.recording { animation: pulseRed 1s infinite; background: #c0392b; }
    @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(231,76,60,0.7); } 70% { box-shadow: 0 0 0 20px rgba(231,76,60,0); } 100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); } }

    .code-box { width: 100%; height: 140px; background: #05030a; border: 2px solid rgba(255,215,0,0.4); border-radius: 12px; color: #00f3ff; font-family: monospace; font-size: 10pt; padding: 15px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>

  <header>
    <div style="flex: 1; display: flex; justify-content: flex-start;"></div>
    <div style="flex: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <div class="app-title"><i class="fa-solid fa-book-bookmark"></i> <span id="ui-header-title">Живая Книга | Редактор</span></div>
      <div style="font-size: 11pt; color: #d1c4e9; margin-top: 4px; font-family: var(--font-body);">
        автор Ольга Тимофеева / <a href="https://vk.ru/club221025676" target="_blank" style="color: var(--primary-gold); text-decoration: none; text-shadow: 0 0 5px rgba(255,215,0,0.5);">"Да! Доступный Английский"</a>
      </div>
    </div>
    <div style="flex: 1; display: flex; justify-content: flex-end; align-items: center;">
      <select id="global-lang-select" class="header-lang-select" onchange="app.changeLanguage(this.value)">
        <option value="ru">Русский</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="it">Italiano</option><option value="es">Español</option>
      </select>
    </div>
  </header>

  <div class="workspace">
    <div class="editor-panel">
      <div class="editor-tabs">
        <button class="tab-btn active" onclick="app.switchTab('content')"><i class="fa-solid fa-file-pen"></i> <span data-i18n="tabContent">Контент</span></button>
        <button class="tab-btn" onclick="app.switchTab('audio')"><i class="fa-solid fa-volume-high"></i> <span data-i18n="tabAudio">Аудио</span></button>
        <button class="tab-btn" onclick="app.switchTab('tasks')"><i class="fa-solid fa-wand-magic-sparkles"></i> <span data-i18n="tabTasks">Задания</span></button>
        <button class="tab-btn" onclick="app.switchTab('design')"><i class="fa-solid fa-palette"></i> <span data-i18n="tabDesign">Дизайн</span></button>
        <button class="tab-btn" onclick="app.switchTab('templates')"><i class="fa-solid fa-layer-group"></i> <span data-i18n="tabTemplates">Шаблоны</span></button>
        <button class="tab-btn" onclick="app.switchTab('export')"><i class="fa-solid fa-box-archive"></i> <span data-i18n="tabExport">Экспорт</span></button>
      </div>

      <div class="tab-content-container">
        <!-- КОНТЕНТ -->
        <div id="tab-content" class="tab-panel active">
          <div class="form-group">
            <label><span data-i18n="pagesLbl">Страницы книги</span> (<span id="page-count-lbl">1</span>/50):</label>
            <div class="page-list-bar" id="page-chip-list"></div>
            <div style="display:flex; gap:10px;">
              <button class="btn btn-magic" onclick="app.addPage()"><i class="fa-solid fa-plus"></i> <span data-i18n="newPageBtn">Новая страница</span></button>
              <button class="btn btn-danger" onclick="app.deleteCurrentPage()"><i class="fa-solid fa-trash"></i> <span data-i18n="delPageBtn">Удалить</span></button>
            </div>
          </div>
          <hr style="border-color:rgba(255,215,0,0.2); margin:20px 0;">

          <div class="form-group"><label data-i18n="bookTitleLbl">Заголовок Книги (Обложка):</label><input type="text" id="input-book-title" class="form-control" oninput="app.updateBookInfo()"></div>
          <div class="form-group"><label data-i18n="bookAuthorLbl">Подзаголовок / Автор:</label><input type="text" id="input-book-author" class="form-control" oninput="app.updateBookInfo()"></div>
          <div class="form-group">
            <label data-i18n="bookCoverLbl">Изображение Обложки:</label>
            <div style="display: flex; gap: 10px;">
              <input type="text" id="input-cover-img" class="form-control" placeholder="URL или файл ->" oninput="app.updateBookInfo()">
              <label class="btn btn-magic" style="margin: 0; cursor: pointer; padding:12px; display: flex; align-items: center; justify-content: center;"><i class="fa-solid fa-upload"></i><input type="file" accept="image/*" style="display:none;" onchange="app.uploadImage(event, 'coverImage', true)"></label>
            </div>
          </div>
          <hr style="border-color:rgba(255,215,0,0.2); margin:20px 0;">
          <div class="form-group">
            <label data-i18n="pageSideLbl">Сторона текущей страницы:</label>
            <select id="input-page-side" class="form-control" onchange="app.updateCurrentPageSide()">
              <option value="right" data-i18n="sideRight">Правая (Right)</option>
              <option value="left" data-i18n="sideLeft">Левая (Left)</option>
            </select>
          </div>
          <div class="form-group"><label data-i18n="pageTextLbl">Текст текущей страницы:</label><textarea id="input-page-text" class="form-control" oninput="app.updateCurrentPageText()"></textarea></div>
          
          <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 120px;"><label data-i18n="textColorLbl">Цвет текста:</label><input type="color" id="input-text-color" class="form-control" onchange="app.updateTextStyle('color', this.value)" style="height: 50px;"></div>
            <div class="form-group" style="flex: 1; min-width: 120px;"><label data-i18n="textSizeLbl">Размер (px):</label><input type="number" id="input-text-size" class="form-control" oninput="app.updateTextStyle('fontSize', this.value + 'px')"></div>

    class SoundFXManager {
      constructor() { this.ctx = null; this.volume = 0.8; }
      initCtx() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      setVolume(val) { this.volume = parseFloat(val); }
      playFlip(type) { if (type === 'none') return; this.initCtx(); if (type === 'chime') this.playMagicChime(); else if (type === 'whoosh') this.playWindWhoosh(); else if (type === 'softpaper') this.playSoftPaper(); else if (type === 'click') this.playDigitalClick(); else this.playParchmentRustle(); }
      playCurrentFlip() { this.playFlip(window.app ? window.app.state.soundFX.type : 'parchment'); }
      playParchmentRustle() { const bs = this.ctx.sampleRate * 0.35; const buf = this.ctx.createBuffer(1, bs, this.ctx.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1; const n = this.ctx.createBufferSource(); n.buffer = buf; const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 1.5; const g = this.ctx.createGain(); g.gain.setValueAtTime(0.01, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.3 * this.volume, this.ctx.currentTime + 0.1); g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35); n.connect(f); f.connect(g); g.connect(this.ctx.destination); n.start(); n.stop(this.ctx.currentTime + 0.35); }
      playMagicChime() { const now = this.ctx.currentTime; const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51]; freqs.forEach((f, idx) => { const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + idx * 0.04); gain.gain.setValueAtTime(0, now + idx * 0.04); gain.gain.linearRampToValueAtTime(0.15 * this.volume, now + idx * 0.04 + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.3); osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now + idx * 0.04); osc.stop(now + idx * 0.04 + 0.3); }); }
      playWindWhoosh() { const now = this.ctx.currentTime; const bs = this.ctx.sampleRate * 0.25; const buf = this.ctx.createBuffer(1, bs, this.ctx.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1; const n = this.ctx.createBufferSource(); n.buffer = buf; const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(200, now); f.frequency.exponentialRampToValueAtTime(1400, now + 0.12); f.frequency.exponentialRampToValueAtTime(150, now + 0.25); const g = this.ctx.createGain(); g.gain.setValueAtTime(0.01, now); g.gain.linearRampToValueAtTime(0.4 * this.volume, now + 0.1); g.gain.exponentialRampToValueAtTime(0.001, now + 0.25); n.connect(f); f.connect(g); g.connect(this.ctx.destination); n.start(now); n.stop(now + 0.25); }
      playSoftPaper() { const now = this.ctx.currentTime; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(80, now + 0.2); gain.gain.setValueAtTime(0.2 * this.volume, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2); osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.2); }
      playDigitalClick() { const now = this.ctx.currentTime; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.05); gain.gain.setValueAtTime(0.15 * this.volume, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05); osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.05); }
      playSuccess() { this.initCtx(); const notes = [523.25, 659.25, 783.99, 1046.50]; notes.forEach((freq, idx) => { const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.type = 'triangle'; osc.frequency.value = freq; const startTime = this.ctx.currentTime + idx * 0.08; gain.gain.setValueAtTime(0.3 * this.volume, startTime); gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3); osc.connect(gain); gain.connect(this.ctx.destination); osc.start(startTime); osc.stop(startTime + 0.3); }); }
      playError() { this.initCtx(); const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, this.ctx.currentTime); osc.frequency.linearRampToValueAtTime(110, this.ctx.currentTime + 0.3); gain.gain.setValueAtTime(0.4 * this.volume, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3); osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.3); }
      playFound() { this.initCtx(); const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(880, this.ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(1760, this.ctx.currentTime + 0.2); gain.gain.setValueAtTime(0.3 * this.volume, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5); osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.5); }
    }

    class TTSManager {
      constructor() { this.synth = window.speechSynthesis; this.voices = []; this.speaking = false; this.onBoundaryCallback = null; this.onEndCallback = null; this.loadVoices(); }
      loadVoices() { if(this.synth) { this.voices = this.synth.getVoices(); if(this.synth.onvoiceschanged !== undefined) { this.synth.onvoiceschanged = () => { this.voices = this.synth.getVoices(); if (window.app) window.app.populateVoiceList(); }; } } }
      speak(text, config) { if (!this.synth) return; this.stop(); const utterance = new SpeechSynthesisUtterance(text); if (this.voices[config.voiceIndex]) utterance.voice = this.voices[config.voiceIndex]; utterance.pitch = config.pitch || 1.0; utterance.rate = config.rate || 1.0; utterance.onboundary = (e) => { if (e.name === 'word' && this.onBoundaryCallback) this.onBoundaryCallback(e.charIndex, e.charLength); }; utterance.onend = () => { this.speaking = false; if (this.onEndCallback) this.onEndCallback(); }; this.speaking = true; this.synth.speak(utterance); }
      stop() { if (this.synth && this.synth.speaking) { this.synth.cancel(); this.speaking = false; } }
    }

    class DragDropManager {
      constructor(app) { this.app = app; }
      attach(element, onMoveCallback, onResizeCallback) {
        if (!element.querySelector('.resizer')) {
          const resizer = document.createElement('div'); resizer.className = 'resizer'; element.appendChild(resizer);
        }
        
        let isDragging = false; let isResizing = false;
        let startX, startY, startW, startH;

        element.onmousedown = (e) => {
          if (this.app.mode !== 'edit' && this.app.mode !== 'cover') return;
          e.stopPropagation();
          const rect = element.getBoundingClientRect(); const parentRect = element.parentElement.getBoundingClientRect();
          
          if (e.target.classList.contains('resizer')) {
            isResizing = true; startX = e.clientX; startY = e.clientY;
            startW = element.offsetWidth; startH = element.offsetHeight;
          } else {
            isDragging = true; element.classList.add('dragging');
            startX = e.clientX - rect.left; startY = e.clientY - rect.top;
          }

          const onMouseMove = (moveEv) => {
            if (isResizing) {
              const newW = Math.max(50, startW + (moveEv.clientX - startX));
              const newH = Math.max(30, startH + (moveEv.clientY - startY));
              element.style.width = newW + 'px';
              if(onResizeCallback.length > 1) { element.style.height = newH + 'px'; onResizeCallback(newW, newH); } 
              else { onResizeCallback(newW); }
            } else if (isDragging) {
              let newX = moveEv.clientX - parentRect.left - startX; let newY = moveEv.clientY - parentRect.top - startY;
              newX = Math.max(0, Math.min(newX, parentRect.width - element.offsetWidth)); newY = Math.max(0, Math.min(newY, parentRect.height - element.offsetHeight));
              element.style.left = newX + 'px'; element.style.top = newY + 'px';
              if (onMoveCallback) onMoveCallback(newX, newY);
            }
          };

          const onMouseUp = () => {
            isDragging = false; isResizing = false; element.classList.remove('dragging');
            window.removeEventListener('mousemove', onMouseMove); window.removeEventListener('mouseup', onMouseUp);
            this.app.renderEditorForm(); 
          };

          window.addEventListener('mousemove', onMouseMove); window.addEventListener('mouseup', onMouseUp);
        };
      }
    }

          task.matchPairs.forEach((pair, idx) => { rowsHtml += `<div class="match-row" style="margin-bottom:8px;"><input type="text" class="form-control" value="${pair.left}" oninput="app.updateMatchPair(${idx}, 'left', this.value)"><input type="text" class="form-control" value="${pair.right}" oninput="app.updateMatchPair(${idx}, 'right', this.value)"><button class="btn btn-danger" onclick="app.removeMatchPair(${idx})"><i class="fa-solid fa-trash"></i></button></div>`; });
          container.innerHTML = `<div class="form-group"><label>${this.t('taskPairsHint')}</label>${rowsHtml}<button class="btn btn-magic btn-block" style="margin-top:8px;" onclick="app.addMatchPair()">${this.t('addPairBtn')}</button></div>`;
        } else if (task.type === 'input') { container.innerHTML = `<div class="form-group"><label>${this.t('taskInputHint')}</label><input type="text" id="task-input-correct" class="form-control" value="${task.inputCorrect || ''}" oninput="app.updateTaskData()"></div>`;
        } else if (task.type === 'select') { container.innerHTML = `<div class="form-group"><label>${this.t('taskOptHint')}</label><textarea id="task-select-options" class="form-control" oninput="app.updateTaskData()">${(task.selectOptions || []).join('\n')}</textarea></div><div class="form-group"><label>Индекс правильного:</label><input type="number" id="task-select-correct" class="form-control" value="${task.selectCorrect || 0}" min="0" oninput="app.updateTaskData()"></div>`;
        } else if (task.type === 'oral') { container.innerHTML = `<div class="form-group"><p style="font-size: 12pt; color: #a090c0;">${this.t('taskOral')}</p></div>`;
        } else if (task.type === 'embed') { container.innerHTML = `<div class="form-group"><label>${this.t('taskUrlHint')}</label><input type="text" id="task-embed-url" class="form-control" value="${task.embedUrl || ''}" oninput="app.updateTaskData()"></div>`; }
      }

      updateTaskData() {
        const task = this.state.pages[this.state.currentPageIndex].task; task.question = document.getElementById('task-question-input').value;
        if (task.type === 'single' || task.type === 'multiple') { const optEl = document.getElementById('task-options-input'); const corEl = document.getElementById('task-correct-input'); if (optEl) task.options = optEl.value.split('\n').filter(s => s.trim() !== ''); if (corEl) task.correct = corEl.value.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
        } else if (task.type === 'input') { const inEl = document.getElementById('task-input-correct'); if (inEl) task.inputCorrect = inEl.value;
        } else if (task.type === 'select') { const selOpt = document.getElementById('task-select-options'); const selCor = document.getElementById('task-select-correct'); if (selOpt) task.selectOptions = selOpt.value.split('\n').filter(s => s.trim() !== ''); if (selCor) task.selectCorrect = parseInt(selCor.value) || 0;
        } else if (task.type === 'embed') { const emb = document.getElementById('task-embed-url'); if (emb) task.embedUrl = emb.value; }
      }
      addMatchPair() { const task = this.state.pages[this.state.currentPageIndex].task; if (!task.matchPairs) task.matchPairs = []; task.matchPairs.push({left: '', right: ''}); this.renderTaskEditorFields(task); }
      removeMatchPair(idx) { this.state.pages[this.state.currentPageIndex].task.matchPairs.splice(idx, 1); this.renderTaskEditorFields(this.state.pages[this.state.currentPageIndex].task); }
      updateMatchPair(idx, field, val) { this.state.pages[this.state.currentPageIndex].task.matchPairs[idx][field] = val; }

      loadTemplatesData() { try { return JSON.parse(localStorage.getItem('living_book_templates')) || {}; } catch (e) { return {}; } }
      saveTemplatesData(data) { try { localStorage.setItem('living_book_templates', JSON.stringify(data)); } catch (e) { alert("Ошибка сохранения (память заполнена)."); } }
      saveCurrentAsTemplate() {
        const name = prompt(this.t('templatePromptName')); if (!name) return;
        const tpls = this.loadTemplatesData(); tpls[name] = JSON.parse(JSON.stringify(this.state)); 
        this.saveTemplatesData(tpls); this.renderTemplatesList();
      }
      loadTemplate(name) { const tpls = this.loadTemplatesData(); if (tpls[name]) { this.state = Object.assign(new BookState(), tpls[name]); this.applyLanguage(); this.renderEditorForm(); this.renderStage(); alert(this.t('bookLoaded')); } }
      renameTemplate(oldName) { const newName = prompt(this.t('templatePromptRename'), oldName); if (!newName || newName === oldName) return; const tpls = this.loadTemplatesData(); if(tpls[newName]) { alert("Имя занято!"); return; } tpls[newName] = tpls[oldName]; delete tpls[oldName]; this.saveTemplatesData(tpls); this.renderTemplatesList(); }
      deleteTemplate(name) { if(confirm(this.t('templateConfirmDel'))) { const tpls = this.loadTemplatesData(); delete tpls[name]; this.saveTemplatesData(tpls); this.renderTemplatesList(); } }
      renderTemplatesList() {
        const tpls = this.loadTemplatesData(); const container = document.getElementById('templates-list-container'); container.innerHTML = '';
        if(Object.keys(tpls).length === 0) { container.innerHTML = `<p style="color:#aaa; font-style:italic;">${this.t('emptyTemplates')}</p>`; return; }
        for (const name in tpls) {
            container.innerHTML += `<div class="template-item"><span>${name}</span><div class="template-actions"><button class="btn-action" title="Загрузить" onclick="app.loadTemplate('${name}')"><i class="fa-solid fa-folder-open"></i></button><button class="btn-action" title="Переименовать" onclick="app.renameTemplate('${name}')"><i class="fa-solid fa-pen"></i></button><button class="btn-action" style="color:#ff6b6b; border-color:rgba(255,107,107,0.4);" title="Удалить" onclick="app.deleteTemplate('${name}')"><i class="fa-solid fa-trash"></i></button></div></div>`;
        }
      }

      buildPageHtml(curPage, idx, isZoom = false, isExport = false) {
        const ts = curPage.textStyle || {};
        const widthStr = ts.width && ts.width !== 'auto' ? (ts.width.includes('px') || ts.width.includes('%') ? ts.width : ts.width + 'px') : 'auto';
        let rgbaBg = 'transparent';
        if (ts.bgOpacity > 0 && ts.bgColor) { const hex = ts.bgColor.replace('#', ''); const r = parseInt(hex.substring(0, 2), 16) || 255; const g = parseInt(hex.substring(2, 4), 16) || 255; const b = parseInt(hex.substring(4, 6), 16) || 255; rgbaBg = `rgba(${r}, ${g}, ${b}, ${ts.bgOpacity})`; }
        
        let processedText = curPage.text;
        if(curPage.glossary && curPage.glossary.length > 0) {
            curPage.glossary.forEach(item => { if(item.word) processedText = processedText.replace(new RegExp(`(${item.word})`, 'gi'), `<span class="glossary-word" data-hint="${item.hint}">$1</span>`); });
        }

        let eggsHtml = '';
        if(curPage.easterEggs && curPage.easterEggs.length > 0) {
            curPage.easterEggs.forEach((egg, eIdx) => {
                if(!isExport && this.mode === 'book' && egg.found) return;
                let eggStyle = `left:${egg.x}px; top:${egg.y}px; width:${egg.width||60}px; height:${egg.height||60}px;`;
                if(egg.image) { eggStyle += `background-image:url('${egg.image}'); background-size:contain; background-repeat:no-repeat; background-position:center;`; }
                else if (this.mode === 'edit' && !isExport) { eggStyle += `background:rgba(255,0,0,0.3); border:1px dashed red;`; }
                let clickAct = '';
                if(isExport) clickAct = `onclick="findEgg(${egg.id}, ${idx}, event)"`;
                else if(this.mode === 'book') clickAct = `onclick="app.clickEgg(${idx}, ${egg.id}, event)"`;
                eggsHtml += `<div class="canvas-element easter-egg-element" id="egg-${idx}-${eIdx}" style="${eggStyle}" ${clickAct}></div>`;
            });
        }

        let bgStyle = curPage.bgImage ? `background-image: url('${curPage.bgImage}'); background-size: cover; background-position: center;` : `background-color: ${this.state.design.pageBg};`;
        
        let taskBtn = '';
        if(curPage.task && curPage.task.enabled) {
            let taskAct = isExport ? `onclick="openTaskModalExport(${idx}, event)"` : `onclick="app.openTaskModal(${idx}, event)"`;
            taskBtn = `<button class="trigger-task-btn" ${taskAct}><i class="fa-solid fa-sparkles"></i> ${this.t('executeTask')}</button>`;
        }

        let className = isZoom ? "zoomed-page-clone" : "page-wrapper";
        if(this.mode === 'edit') className += ' edit-mode'; else className += ' read-mode';
        
        let wrapperAct = '';
        if(!isExport && this.mode === 'book') wrapperAct = isZoom ? `onclick="app.closeZoom()"` : `onclick="app.openZoom(${idx}, event)"`;
        else if (isExport) wrapperAct = isZoom ? `onclick="closeZoom()"` : `onclick="openZoom(${idx}, event)"`;

        let ttsBtn = '';
        if(!isZoom && (this.mode === 'book' || isExport)) {
            let ttsAct = isExport ? `onclick="readPageTTSExport(${idx}, event)"` : `onclick="app.readPageTTS(${idx}, event)"`;
            ttsBtn = `<button class="tts-btn" ${ttsAct}><i class="fa-solid fa-volume-high"></i></button>`;
        }

        return `
            <div class="${className}" style="${bgStyle}" ${wrapperAct}>
                <div class="canvas-element page-text-render" id="text-${idx}" style="left:${curPage.textPos.x}px; top:${curPage.textPos.y}px; color:${ts.color||'#2c1810'}; font-size:${ts.fontSize||'20px'}; text-align:${ts.textAlign||'left'}; width:${widthStr}; background-color:${rgbaBg}; padding:${ts.bgPadding||0}px; border-radius:8px; ${ts.bgImage ? `background-image:url('${ts.bgImage}'); background-size:cover; background-position:center;` : ''}">${processedText}</div>
                ${curPage.image ? `<div class="canvas-element" id="img-${idx}" style="left:${curPage.imgPos.x}px; top:${curPage.imgPos.y}px; width:${curPage.imageSize?.width||'300px'}; height:${curPage.imageSize?.height||'250px'};"><img src="${curPage.image}" class="page-img-render"></div>` : ''}
                ${eggsHtml}
                ${taskBtn}
                ${ttsBtn}
            </div>
        `;
      }

      openZoom(pageIdx, e) {
        if(e) e.stopPropagation();
        const curPage = this.state.pages[pageIdx];
        const overlay = document.getElementById('zoom-overlay');
        overlay.innerHTML = this.buildPageHtml(curPage, pageIdx, true, false);
        overlay.classList.add('active');
      }
      closeZoom() { const overlay = document.getElementById('zoom-overlay'); overlay.classList.remove('active'); setTimeout(() => { overlay.innerHTML = ''; }, 300); }
      
      clickEgg(pageIdx, eggId, e) {
        if(e) e.stopPropagation();
        if(this.mode === 'edit' || this.mode === 'cover') return;
        const egg = this.state.pages[pageIdx].easterEggs.find(x => x.id === eggId);
        if(egg && !egg.found) {
            this.soundFX.playFound(); this.state.userScore += (egg.points || 10); egg.found = true;
            const pScore = document.createElement('div'); pScore.className = 'egg-found-anim'; pScore.style.left = e.clientX + 'px'; pScore.style.top = e.clientY + 'px'; pScore.innerHTML = `+${egg.points}`; document.body.appendChild(pScore); setTimeout(() => pScore.remove(), 1000);
            
            if(document.getElementById('zoom-overlay').classList.contains('active')) { this.openZoom(pageIdx); } else { this.renderStage(); }
        }
      }

      renderStage() {
        if(this.pageFlip) { this.pageFlip.destroy(); this.pageFlip = null; }
        document.getElementById('flipbook').innerHTML = '';
        
        const pMap = document.getElementById('progress-map'); const pFill = document.getElementById('progress-fill');
        const sFlip = document.getElementById('book-stage-flip'); const sEdit = document.getElementById('book-stage-edit');
        
        pMap.style.display = 'none'; pFill.style.width = '0%';
        sFlip.style.display = 'none'; sEdit.style.display = 'none';

        if (this.mode === 'feedback') {
            sEdit.style.display = 'flex'; sEdit.style.boxShadow = 'none'; sEdit.style.border = 'none';
            const timeSpent = Math.round((Date.now() - this.sessionData.startTime) / 1000); const m = Math.floor(timeSpent / 60); const s = timeSpent % 60;
            const stats = `Score: ${this.state.userScore}. Errors: ${this.sessionData.errors}. Time: ${m}m ${s}s.`;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(stats)}&color=8a2be2&bgcolor=fcf8e8`;

            sEdit.innerHTML = `<div class="feedback-view" style="font-family:${this.state.design.fontFamily}; width:100%; border-radius:12px; box-shadow: 0 0 45px rgba(0,0,0,0.9);">
                <div class="badge-icon"><i class="fa-solid fa-award"></i></div>
                <h2 style="font-family:var(--font-title); color:var(--primary-gold); font-size:2rem; margin-bottom:10px;">${this.state.design.badge}</h2>
                <div style="display:flex; justify-content:center; gap:30px; margin-bottom: 20px;">
                    <div style="text-align:left;">
                        <p style="color:var(--primary-gold); margin:5px 0;">${this.t('score')}: <strong>${this.state.userScore}</strong></p>
                        <p style="color:#ff6b6b; margin:5px 0;">${this.t('errors')}: <strong>${this.sessionData.errors}</strong></p>
                        <p style="color:#00f3ff; margin:5px 0;">${this.t('time')}: <strong>${m}${this.t('min')} ${s}${this.t('sec')}</strong></p>
                    </div>
                    <div class="qr-container"><img src="${qrUrl}" alt="QR"></div>
                </div>
                <button class="btn btn-magic" onclick="app.state.userScore=0; app.setMode('cover');" style="width:250px;"><i class="fa-solid fa-rotate-right"></i> ${this.t('restart')}</button>
                </div>`;
            return;
        }

        if (this.mode === 'cover' || this.mode === 'edit') {
            sEdit.style.display = 'flex'; sEdit.style.boxShadow = '0 0 45px rgba(0,0,0,0.9)'; sEdit.style.border = '6px solid #2a1a08';
            sEdit.style.fontFamily = this.state.design.fontFamily;
            
            let leftHtml = ''; let rightHtml = '';
            const shirtHtml = `<div class="shirt-half" style="background-color:${this.state.design.shirtColor};"></div>`;
            
            if (this.mode === 'cover') {
                leftHtml = shirtHtml;
                let coverStyle = this.state.coverImage ? `background-image: url('${this.state.coverImage}'); background-size: cover; background-position: center;` : `background: linear-gradient(135deg, #1f0d3d, #0d061a);`;
                
                rightHtml = `<div class="page-wrapper edit-mode" style="${coverStyle}">
                    <div class="canvas-element" id="cover-title-drag" style="left:${this.state.coverTitlePos.x}px; top:${this.state.coverTitlePos.y}px; width:${this.state.coverTitleWidth}px; z-index:50;">
                        <div class="cover-title" style="font-size:2.5rem; color:#ffd700; font-family:var(--font-title); text-align:center; ${this.state.coverImage ? 'background: rgba(13, 6, 26, 0.6); backdrop-filter: blur(4px); padding:10px; border-radius:12px;' : ''}">${this.state.title}</div>
                    </div>
                    <div class="canvas-element" id="cover-author-drag" style="left:${this.state.coverAuthorPos.x}px; top:${this.state.coverAuthorPos.y}px; width:${this.state.coverAuthorWidth}px; z-index:50;">
                        <div class="cover-subtitle" style="color:#fff; text-align:center; ${this.state.coverImage ? 'background: rgba(13, 6, 26, 0.6); backdrop-filter: blur(4px); padding:5px; border-radius:12px;' : ''}">${this.state.author}</div>
                    </div>
                </div>`;
            } else {
                const curPage = this.state.pages[this.state.currentPageIndex];
                if (curPage.side === 'left') {
                    leftHtml = this.buildPageHtml(curPage, this.state.currentPageIndex, false, false);
                    rightHtml = shirtHtml;
                } else {
                    leftHtml = shirtHtml;
                    rightHtml = this.buildPageHtml(curPage, this.state.currentPageIndex, false, false);
                }
            }
            
            sEdit.innerHTML = `<div class="edit-half" style="position:relative; z-index:1;">${leftHtml}</div><div class="edit-half" style="position:relative; z-index:1;">${rightHtml}</div>`;
            
            setTimeout(() => {
                if (this.mode === 'cover') {
                    const tEl = document.getElementById('cover-title-drag'); const aEl = document.getElementById('cover-author-drag');
                    if (tEl) this.dragDrop.attach(tEl, (x,y) => { this.state.coverTitlePos={x,y}; }, (w) => { this.state.coverTitleWidth=w; });
                    if (aEl) this.dragDrop.attach(aEl, (x,y) => { this.state.coverAuthorPos={x,y}; }, (w) => { this.state.coverAuthorWidth=w; });
                } else {
                    const curPage = this.state.pages[this.state.currentPageIndex];
                    const activeHalf = curPage.side === 'left' ? sEdit.children[0] : sEdit.children[1];
                    const textEl = activeHalf.querySelector('.page-text-render');
                    const imgEl = activeHalf.querySelector('.page-img-render')?.parentElement;
                    const eggs = activeHalf.querySelectorAll('.easter-egg-element');
                    
                    if(textEl) this.dragDrop.attach(textEl, (x,y) => { curPage.textPos={x,y}; }, (w) => { curPage.textStyle.width = w+'px'; });
                    if(imgEl) this.dragDrop.attach(imgEl, (x,y) => { curPage.imgPos={x,y}; }, (w,h) => { curPage.imageSize = {width:w+'px', height:h+'px'}; });
                    eggs.forEach((el) => {
                        const parts = el.id.split('-'); if(parts.length===3) {
                            const eIdx = parseInt(parts[2]);
                            this.dragDrop.attach(el, (x,y) => { curPage.easterEggs[eIdx].x=x; curPage.easterEggs[eIdx].y=y; }, (w,h) => { curPage.easterEggs[eIdx].width=w; curPage.easterEggs[eIdx].height=h; });
                        }
                    });
                }
            }, 50);
            return;
        }

        if (this.mode === 'book') {
            sFlip.style.display = 'flex'; pMap.style.display = 'block'; sFlip.style.fontFamily = this.state.design.fontFamily;
            const flipbookEl = document.getElementById('flipbook');
            let html = '';
            let coverStyle = this.state.coverImage ? `background-image: url('${this.state.coverImage}'); background-size: cover; background-position: center;` : `background: linear-gradient(135deg, #1f0d3d, #0d061a);`;
            
            html += `<div class="page" data-density="hard"><div class="page-wrapper read-mode" style="${coverStyle}">
                <div style="position:absolute; left:${this.state.coverTitlePos.x}px; top:${this.state.coverTitlePos.y}px; width:${this.state.coverTitleWidth}px; z-index:50; text-align:center;"><div class="cover-title" style="font-size:2.5rem; color:#ffd700; font-family:var(--font-title); ${this.state.coverImage ? 'background: rgba(13, 6, 26, 0.6); backdrop-filter: blur(4px); padding:10px; border-radius:12px;' : ''}">${this.state.title}</div></div>
                <div style="position:absolute; left:${this.state.coverAuthorPos.x}px; top:${this.state.coverAuthorPos.y}px; width:${this.state.coverAuthorWidth}px; z-index:50; text-align:center;"><div class="cover-subtitle" style="color:#fff; ${this.state.coverImage ? 'background: rgba(13, 6, 26, 0.6); backdrop-filter: blur(4px); padding:5px; border-radius:12px;' : ''}">${this.state.author}</div></div>
            </div></div>`;
            html += `<div class="page" data-density="hard"><div class="page-wrapper" style="background-color: ${this.state.design.shirtColor}; box-shadow: inset 0 0 50px rgba(0,0,0,0.8);"></div></div>`;
            
            let pageCount = 2;
            this.state.pages.forEach((p, idx) => {
                const nextIsLeft = pageCount % 2 !== 0;
                if(p.side === 'left' && !nextIsLeft) {
                    html += `<div class="page"><div class="page-wrapper" style="background-color: ${this.state.design.shirtColor}; box-shadow: inset 0 0 30px rgba(0,0,0,0.5);"></div></div>`;
                    pageCount++;
                }
                else if (p.side === 'right' && nextIsLeft) {
                    html += `<div class="page"><div class="page-wrapper" style="background-color: ${this.state.design.shirtColor}; box-shadow: inset 0 0 30px rgba(0,0,0,0.5);"></div></div>`;
                    pageCount++;
                }
                html += `<div class="page">${this.buildPageHtml(p, idx, false, false)}</div>`;
                pageCount++;
            });
            
            if (pageCount % 2 !== 0) { 
                html += `<div class="page"><div class="page-wrapper" style="background-color: ${this.state.design.shirtColor}; box-shadow: inset 0 0 30px rgba(0,0,0,0.5);"></div></div>`; 
            }
            html += `<div class="page" data-density="hard"><div class="page-wrapper" style="background-color: ${this.state.design.shirtColor}; box-shadow: inset 0 0 50px rgba(0,0,0,0.8);"></div></div>`;
            html += `<div class="page" data-density="hard"><div class="page-wrapper" style="${coverStyle} display:flex; flex-direction:column; align-items:center; justify-content:center;"><button class="btn btn-magic" onclick="app.setMode('feedback')" style="z-index:90;">Завершить</button></div></div>`;
            
            flipbookEl.innerHTML = html;
            this.pageFlip = new St.PageFlip(flipbookEl, { width: 450, height: 600, size: "stretch", minWidth: 300, maxWidth: 450, minHeight: 400, maxHeight: 600, maxShadowOpacity: 0.5, showCover: true, mobileScrollSupport: true, usePortrait: false, flippingTime: this.state.design.animDuration || 1000 });
            this.pageFlip.loadFromHTML(flipbookEl.querySelectorAll('.page'));
            
            this.pageFlip.on('flip', (e) => {
                this.soundFX.playFlip(this.state.soundFX.type);
                const total = this.pageFlip.getPageCount(); pFill.style.width = ((e.data + 1) / total * 100) + '%';
            });
        }
      }

      readPageTTS(idx, e) {
        if(e) e.stopPropagation();
        this.tts.speak(this.state.pages[idx].text, this.state.tts);
      }

      openTaskModal(pageIdx, e) {
        if(e) e.stopPropagation();
        this.currentTaskPageIdx = pageIdx; const task = this.state.pages[pageIdx].task;
        const modal = document.getElementById('modal-overlay'); const card = document.getElementById('modal-card');
        card.innerHTML = `<div class="task-question">${task.question || "Задание"}</div><div id="task-modal-content"></div><button class="btn btn-gold btn-block" id="task-submit-btn" style="margin-top:20px;" onclick="app.submitTaskAnswer()">${this.t('checkAnswerBtn')}</button>`;
        const contentBox = document.getElementById('task-modal-content'); const submitBtn = document.getElementById('task-submit-btn');

        if (task.type === 'single' || task.type === 'multiple') {
          const inputType = task.type === 'single' ? 'radio' : 'checkbox';
          task.options.forEach((opt, idx) => { const optDiv = document.createElement('label'); optDiv.className = 'task-option'; optDiv.innerHTML = `<input type="${inputType}" name="task-opt" value="${idx}"><span>${opt}</span>`; contentBox.appendChild(optDiv); });
        } else if (task.type === 'matching') {
          let html = '<div class="match-container">'; const shuffledRight = [...(task.matchPairs || [])].sort(() => Math.random() - 0.5);
          task.matchPairs.forEach((pair, idx) => { let selectOptionsHtml = '<option value="">-- выбор --</option>'; shuffledRight.forEach((rPair) => { selectOptionsHtml += `<option value="${rPair.right}">${rPair.right}</option>`; }); html += `<div class="match-row"><span>${pair.left}</span><select class="form-control match-select" data-index="${idx}" data-correct="${pair.right}">${selectOptionsHtml}</select></div>`; });
          html += '</div>'; contentBox.innerHTML = html;
        } else if (task.type === 'input') { contentBox.innerHTML = `<div class="form-group"><input type="text" id="task-user-input" class="form-control" placeholder="Ответ..."></div>`;
        } else if (task.type === 'select') {
          let opts = '<option value="">-- выбор --</option>'; (task.selectOptions || []).forEach((opt, idx) => { opts += `<option value="${idx}">${opt}</option>`; });
          contentBox.innerHTML = `<div class="form-group"><select id="task-user-select" class="form-control">${opts}</select></div>`;
        } else if (task.type === 'oral') {
          contentBox.innerHTML = `<div style="text-align:center;"><p style="margin-bottom: 20px; color: var(--primary-gold);">${this.t('recordMic')}</p><div class="audio-recorder"><button id="mic-btn" class="record-btn" onclick="app.toggleRecordAudio()"><i class="fa-solid fa-microphone"></i></button></div><audio id="audio-playback" controls style="display:none; margin: 15px auto; width: 100%;"></audio></div>`;
          submitBtn.textContent = this.t('sendAudioAnswer'); submitBtn.style.display = 'none';
        } else if (task.type === 'embed') {
          let embedSrc = task.embedUrl || ''; if (embedSrc.includes('wordwall.net') && !embedSrc.includes('/embed')) embedSrc = embedSrc.replace('/resource/', '/embed/');
          contentBox.innerHTML = `<div style="width:100%; height:320px;"><iframe src="${embedSrc}" width="100%" height="100%" style="border:none; border-radius:12px;" allowfullscreen></iframe></div>`;
        }
        modal.classList.add('active');
      }

      async toggleRecordAudio() {
        const micBtn = document.getElementById('mic-btn');
        if (this.isRecording) { this.mediaRecorder.stop(); this.isRecording = false; micBtn.classList.remove('recording');
        } else {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                this.mediaRecorder = new MediaRecorder(stream); this.audioChunks = []; this.mediaRecorder.ondataavailable = e => this.audioChunks.push(e.data);
                this.mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(this.audioChunks, { type: 'audio/mp3' }); const audioUrl = URL.createObjectURL(audioBlob);
                    const playback = document.getElementById('audio-playback'); playback.src = audioUrl; playback.style.display = 'block'; document.getElementById('task-submit-btn').style.display = 'block'; this.sessionData.audioAnswers.push(audioUrl); 
                };
                this.mediaRecorder.start(); this.isRecording = true; micBtn.classList.add('recording');
            } catch (err) { alert("Микрофон недоступен."); document.getElementById('task-submit-btn').style.display = 'block'; }
        }
      }

      submitTaskAnswer() {
        const task = this.state.pages[this.currentTaskPageIdx].task; let isCorrect = false;
        if (task.type === 'oral') { isCorrect = true; } 
        else if (task.type === 'single' || task.type === 'multiple') { const selected = Array.from(document.querySelectorAll('input[name="task-opt"]:checked')).map(i => parseInt(i.value)); isCorrect = selected.length === task.correct.length && selected.every(val => task.correct.includes(val)); } 
        else if (task.type === 'matching') { const selects = document.querySelectorAll('.match-select'); let allMatch = true; selects.forEach(sel => { if (sel.value !== sel.getAttribute('data-correct')) allMatch = false; }); isCorrect = allMatch && selects.length > 0; } 
        else if (task.type === 'input') { isCorrect = document.getElementById('task-user-input').value.trim().toLowerCase() === (task.inputCorrect || '').trim().toLowerCase(); } 
        else if (task.type === 'select') { isCorrect = parseInt(document.getElementById('task-user-select').value) === task.selectCorrect; } 
        else if (task.type === 'embed') { isCorrect = true; }

        if (isCorrect) { this.soundFX.playSuccess(); this.state.userScore += 10; alert(this.t('correctAlert')); }
        else { this.soundFX.playError(); this.sessionData.errors += 1; alert(this.t('errorAlert')); }
        
        document.getElementById('modal-overlay').classList.remove('active');
        if(document.getElementById('zoom-overlay').classList.contains('active')) this.openZoom(this.currentTaskPageIdx);
      }

      /* ЭКСПОРТ */
      exportJSON() { const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.state).replace(/</g, '\\u003c')); const dlAnchor = document.createElement('a'); dlAnchor.setAttribute("href", dataStr); dlAnchor.setAttribute("download", `${this.state.title.replace(/\s+/g, '_')}_living_book.json`); document.body.appendChild(dlAnchor); dlAnchor.click(); dlAnchor.remove(); }
      downloadStandaloneHTML() { const htmlCode = this.generateStandaloneHTML(); const dataStr = "data:text/html;charset=utf-8," + encodeURIComponent(htmlCode); const dlAnchor = document.createElement('a'); dlAnchor.setAttribute("href", dataStr); dlAnchor.setAttribute("download", `${this.state.title.replace(/\s+/g, '_')}_book.html`); document.body.appendChild(dlAnchor); dlAnchor.click(); dlAnchor.remove(); }
      importJSON(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (e) => { try { const importedState = JSON.parse(e.target.result); this.state = Object.assign(new BookState(), importedState); this.applyLanguage(); this.renderEditorForm(); this.renderStage(); alert(this.t('bookLoaded')); } catch (err) { alert("Ошибка JSON!"); } }; reader.readAsText(file); }
      updateIframeCode() { document.getElementById('iframe-code-box').value = `<iframe srcdoc="${this.generateStandaloneHTML().replace(/"/g, '&quot;')}" width="900" height="650" style="border:none; border-radius:24px;" allow="autoplay"></iframe>`; }
      copyIframeCode() { this.updateIframeCode(); const copyText = document.getElementById("iframe-code-box"); copyText.select(); document.execCommand("copy"); alert(this.t('iframeCopied')); }

      generateStandaloneHTML() {
        let pagesHtml = '';
        let coverStyle = this.state.coverImage ? `background-image: url('${this.state.coverImage}'); background-size: cover; background-position: center;` : `background: linear-gradient(135deg, #1f0d3d, #0d061a);`;
        
        pagesHtml += `<div class="page" data-density="hard"><div class="page-wrapper read-mode" style="${coverStyle}">
            <div style="position:absolute; left:${this.state.coverTitlePos.x}px; top:${this.state.coverTitlePos.y}px; width:${this.state.coverTitleWidth}px; z-index:50; text-align:center;"><div class="cover-title" style="font-size:2.5rem; color:#ffd700; font-family:var(--font-title); ${this.state.coverImage ? 'background: rgba(13, 6, 26, 0.6); backdrop-filter: blur(4px); padding:10px; border-radius:12px;' : ''}">${this.state.title}</div></div>
            <div style="position:absolute; left:${this.state.coverAuthorPos.x}px; top:${this.state.coverAuthorPos.y}px; width:${this.state.coverAuthorWidth}px; z-index:50; text-align:center;"><div class="cover-subtitle" style="color:#fff; ${this.state.coverImage ? 'background: rgba(13, 6, 26, 0.6); backdrop-filter: blur(4px); padding:5px; border-radius:12px;' : ''}">${this.state.author}</div></div>
        </div></div>`;
        pagesHtml += `<div class="page" data-density="hard"><div class="page-wrapper" style="background-color: ${this.state.design.shirtColor}; box-shadow: inset 0 0 50px rgba(0,0,0,0.8);"></div></div>`;
        
        let pageCount = 2;
        this.state.pages.forEach((p, idx) => {
            const nextIsLeft = pageCount % 2 !== 0;
            if(p.side === 'left' && !nextIsLeft) {
                pagesHtml += `<div class="page"><div class="page-wrapper" style="background-color: ${this.state.design.shirtColor}; box-shadow: inset 0 0 30px rgba(0,0,0,0.5);"></div></div>`;
                pageCount++;
            }
            else if (p.side === 'right' && nextIsLeft) {
                pagesHtml += `<div class="page"><div class="page-wrapper" style="background-color: ${this.state.design.shirtColor}; box-shadow: inset 0 0 30px rgba(0,0,0,0.5);"></div></div>`;
                pageCount++;
            }
            pagesHtml += `<div class="page">${this.buildPageHtml(p, idx, false, true)}</div>`;
            pageCount++;
        });
        
        if (pageCount % 2 !== 0) { 
            pagesHtml += `<div class="page"><div class="page-wrapper" style="background-color: ${this.state.design.shirtColor}; box-shadow: inset 0 0 30px rgba(0,0,0,0.5);"></div></div>`; 
        }
        pagesHtml += `<div class="page" data-density="hard"><div class="page-wrapper" style="background-color: ${this.state.design.shirtColor}; box-shadow: inset 0 0 50px rgba(0,0,0,0.8);"></div></div>`;
        pagesHtml += `<div class="page" data-density="hard"><div class="page-wrapper" style="${coverStyle} display:flex; flex-direction:column; align-items:center; justify-content:center;"><button class="btn" style="background:#ffd700; color:#000; padding:15px 30px; border-radius:20px; font-weight:bold; font-size:16pt;" onclick="showFeedback()">Завершить</button></div></div>`;

        return `<!DOCTYPE html>
<html lang="${this.state.lang}">
<head>
  <meta charset="UTF-8"><title>${this.state.title}</title>
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"><\/script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Comfortaa:wght@400;700&family=Marck+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { margin:0; padding:0; background:#05030a; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:${this.state.design.fontFamily}; font-size: 14pt; overflow: hidden; }
    .book-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .page { background-color: ${this.state.design.pageBg}; background-size: cover; background-position: center; position: relative; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.2);}
    .page-wrapper { width: 100%; height: 100%; position: relative; cursor: zoom-in; background-size: cover; background-position: center; overflow: hidden; }
    .stf__wrapper { border: 6px solid #3d2608; border-radius: 8px; box-shadow: 0 0 45px rgba(0,0,0,0.9); }
    
    .zoom-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 9000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .zoom-overlay.active { opacity: 1; pointer-events: auto; }
    .zoomed-page-clone { width: 450px; height: 600px; transform: scale(1.25); background-color: ${this.state.design.pageBg}; border-radius: 12px; box-shadow: 0 0 50px rgba(0,0,0,1); position: relative; overflow: hidden; cursor: zoom-out; border: 4px solid #3d2608; }
    
    .canvas-element { position:absolute; padding:10px; }
    .page-text-render { white-space:pre-wrap; word-break:break-word; pointer-events:none;}
    .page-img-render { width:100%; height:100%; object-fit:contain; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.4); pointer-events:none;}
    .glossary-word { pointer-events:auto; text-decoration: underline dashed #ffd700; cursor: help; position: relative; font-weight:bold; }
    .glossary-word:hover::after { content: attr(data-hint); position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%); background: #171229; color: #ffd700; padding: 6px 12px; border-radius: 8px; border: 1px solid #ffd700; white-space: nowrap; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events:none;}
    .easter-egg-element { pointer-events:auto; position:absolute; cursor:pointer; z-index:45; transition: transform 0.2s; background-size:contain; background-repeat:no-repeat; background-position:center; }
    .easter-egg-element:hover { transform: scale(1.1); filter: drop-shadow(0 0 10px #ffd700); }
    .egg-found-anim { pointer-events: none; animation: popScore 1s forwards; color: #ffd700; font-weight: bold; text-shadow: 0 0 10px #000; position: absolute; z-index: 999; font-size: 24pt; }
    @keyframes popScore { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }
    .trigger-task-btn { pointer-events:auto; background: linear-gradient(135deg, #ff007f, #7928ca); color: white; padding: 14px 28px; border-radius: 30px; border: 3px solid #ffd700; font-family: ${this.state.design.fontFamily}; font-weight: bold; font-size: 14pt; cursor: pointer; display: flex; align-items: center; gap: 12px; position:absolute; bottom:30px; left:50%; transform:translateX(-50%); z-index:50;}
    .tts-btn { pointer-events:auto; position:absolute; top:15px; right:15px; width:45px; height:45px; border-radius:50%; background:rgba(30,20,50,0.9); border:2px solid #ffd700; color:#ffd700; font-size:14pt; cursor:pointer; z-index:60; display:flex; align-items:center; justify-content:center; }
    
    .modal { position:fixed; top:0;left:0;width:100%;height:100%; background:rgba(0,0,0,0.9); z-index:10000; display:none; align-items:center; justify-content:center; }
    .modal.active { display:flex; }
    .modal-card { width:90%; max-width:600px; background: #1c1335; border:3px solid #ffd700; border-radius:24px; padding:30px; color:#fff; }
    .btn { padding:12px 18px; border-radius:20px; font-weight:bold; cursor:pointer; background:#ffd700; border:none; width:100%; margin-top:20px; font-size:14pt; }
    
    .progress-map-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 60%; height: 15px; background: rgba(0,0,0,0.6); border-radius: 20px; border: 2px solid #ffd700; z-index: 50; overflow: hidden;}
    .progress-map-fill { height: 100%; background: linear-gradient(90deg, #8a2be2, #00f3ff, #ffd700); width: 0%; transition: width 0.5s ease-in-out; }
  </style>
</head>
<body>
  <div id="progress-map" class="progress-map-container"><div id="progress-fill" class="progress-map-fill"></div></div>
  <div class="book-container"><div id="flipbook">${pagesHtml}</div></div>
  <div id="zoom-overlay" class="zoom-overlay" onclick="closeZoom()"></div>
  
  <div id="task-modal" class="modal">
    <div class="modal-card">
      <div id="task-title" style="font-size:16pt; color:#ffd700; margin-bottom:20px; font-family:${this.state.design.fontFamily};">Задание</div>
      <div id="task-content"></div>
      <button class="btn" id="task-submit-btn" onclick="submitTask()">Проверить</button>
    </div>
  </div>

  <script>
    const state = ${JSON.stringify(this.state).replace(/</g, '\\u003c')};
    let pageFlip; let currentTaskIdx = 0; let userScore = 0;
    
    document.addEventListener('DOMContentLoaded', () => {
        pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 450, height: 600, size: "stretch", minWidth: 300, maxWidth: 450, minHeight: 400, maxHeight: 600, maxShadowOpacity: 0.5, showCover: true, mobileScrollSupport: true, usePortrait: false, flippingTime: ${this.state.design.animDuration}
        });
        pageFlip.loadFromHTML(document.getElementById('flipbook').querySelectorAll('.page'));
        
        pageFlip.on('flip', (e) => {
            const total = pageFlip.getPageCount();
            document.getElementById('progress-fill').style.width = ((e.data + 1) / total * 100) + '%';
        });
    });

    function openZoom(idx, e) {
        if(e) e.stopPropagation();
        const p = state.pages[idx];
        const overlay = document.getElementById('zoom-overlay');
        
        let html = '<div class="zoomed-page-clone" onclick="closeZoom()" style="background-color:${this.state.design.pageBg};">';
        if(p.bgImage) html = \`<div class="zoomed-page-clone" onclick="closeZoom()" style="background-image:url('\${p.bgImage}'); background-size:cover; background-position:center;">\`;
        
        const ts = p.textStyle || {};
        const widthStr = ts.width && ts.width !== 'auto' ? (ts.width.includes('px') || ts.width.includes('%') ? ts.width : ts.width + 'px') : 'auto';
        let rgbaBg = 'transparent'; if(ts.bgOpacity > 0) rgbaBg = 'rgba(255,255,255,'+ts.bgOpacity+')'; 
        let pt = p.text;
        if(p.glossary) p.glossary.forEach(item => { if(item.word) pt = pt.replace(new RegExp(\`(\${item.word})\`, 'gi'), \`<span class="glossary-word" data-hint="\${item.hint}">$1</span>\`); });
        
        html += \`<div class="canvas-element page-text-render" style="left:\${p.textPos.x}px; top:\${p.textPos.y}px; color:\${ts.color}; font-size:\${ts.fontSize}; text-align:\${ts.textAlign}; width:\${widthStr}; background-color:\${rgbaBg}; padding:\${ts.bgPadding||0}px; border-radius:8px;">\${pt}</div>\`;
        if(p.image) html += \`<div class="canvas-element" style="left:\${p.imgPos.x}px; top:\${p.imgPos.y}px; width:\${p.imageSize.width}; height:\${p.imageSize.height};"><img src="\${p.image}" class="page-img-render"></div>\`;
        
        if(p.easterEggs) {
            p.easterEggs.forEach((egg, eIdx) => {
                if(!egg.found) {
                    html += \`<div class="canvas-element easter-egg-element" onclick="findEgg(\${egg.id}, \${idx}, event)" style="left:\${egg.x}px; top:\${egg.y}px; width:\${egg.width}px; height:\${egg.height}px; \${egg.image ? \`background-image:url('\${egg.image}'); background-size:contain; background-repeat:no-repeat; background-position:center;\` : ''}"></div>\`;
                }
            });
        }
        if(p.task && p.task.enabled) { html += \`<button class="trigger-task-btn" onclick="openTaskModalExport(\${idx}, event)">Выполнить Задание</button>\`; }
        html += '</div>';
        
        overlay.innerHTML = html; overlay.classList.add('active');
    }
    
    function closeZoom() { document.getElementById('zoom-overlay').classList.remove('active'); setTimeout(() => { document.getElementById('zoom-overlay').innerHTML=''; }, 300); }
    
    function findEgg(eggId, idx, e) {
        if(e) e.stopPropagation();
        const egg = state.pages[idx].easterEggs.find(x => x.id === eggId);
        if(egg && !egg.found) {
            egg.found = true; userScore += (egg.points||10);
            const pScore = document.createElement('div'); pScore.className = 'egg-found-anim'; pScore.style.left = e.clientX + 'px'; pScore.style.top = e.clientY + 'px'; pScore.innerHTML = \`+\${egg.points}\`; document.body.appendChild(pScore); setTimeout(() => pScore.remove(), 1000);
            openZoom(idx);
        }
    }

    function readPageTTSExport(idx, e) {
        if(e) e.stopPropagation();
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(state.pages[idx].text));
    }

    function openTaskModalExport(idx, e) {
        if(e) e.stopPropagation();
        currentTaskIdx = idx; const task = state.pages[idx].task;
        document.getElementById('task-title').textContent = task.question || "Задание";
        const cb = document.getElementById('task-content'); cb.innerHTML = '';
        
        if (task.type === 'single' || task.type === 'multiple') {
          const type = task.type === 'single' ? 'radio' : 'checkbox';
          task.options.forEach((o, i) => { cb.innerHTML += \`<label style="display:flex;gap:10px;margin-bottom:10px;cursor:pointer;"><input type="\${type}" name="topt" value="\${i}"><span>\${o}</span></label>\`; });
        } else if (task.type === 'input') { cb.innerHTML = \`<input type="text" id="tin" style="width:100%;padding:10px;" placeholder="Ответ...">\`;
        } else { cb.innerHTML = \`<p>В автономной версии поддерживаются только тестовые и текстовые задания.</p>\`; }
        document.getElementById('task-modal').classList.add('active');
    }

    function submitTask() {
        const task = state.pages[currentTaskIdx].task; let isCorrect = false;
        if (task.type === 'single' || task.type === 'multiple') { const sel = Array.from(document.querySelectorAll('input[name="topt"]:checked')).map(i=>parseInt(i.value)); isCorrect = sel.length===task.correct.length && sel.every(v=>task.correct.includes(v)); }
        else if (task.type === 'input') { isCorrect = document.getElementById('tin').value.trim().toLowerCase() === (task.inputCorrect||'').trim().toLowerCase(); }
        
        if(isCorrect) { userScore += 10; alert("Верно!"); } else { alert("Ошибка!"); }
        document.getElementById('task-modal').classList.remove('active');
    }
    
    function showFeedback() {
        document.body.innerHTML = \`<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; background:#05020f; color:#fff; text-align:center;">
          <h1 style="color:#ffd700; font-size:3rem;">\${state.design.badge}</h1>
          <h2>\${state.design.slogan}</h2>
          <p style="font-size:1.5rem; margin-top:20px;">Очки: <b style="color:#ffd700;">\${userScore}</b></p>
          <button onclick="location.reload()" style="margin-top:40px; padding:15px 30px; border-radius:20px; font-weight:bold; cursor:pointer; background:#ffd700; border:none; font-size:16pt;">Начать сначала</button>
        </div>\`;
    }
  <\/script>
</body>
</html>`;
      }
    }

    window.app = new LivingBookApp();
    window.addEventListener('DOMContentLoaded', () => { window.app.init(); });
  </script>
</body>
</html>
